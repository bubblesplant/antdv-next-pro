name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    name: Mark new issues for triage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure and apply triage label
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pending triage'
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label })
            } catch (error) {
              if (error.status !== 404) throw error
              try {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name: label,
                  color: 'ededed',
                  description: '等待维护者确认与分类 / Awaiting maintainer triage',
                })
              } catch (creationError) {
                // 允许多个新 Issue 同时触发时，其他运行已创建同名标签。
                if (creationError.status !== 422) throw creationError
              }
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: [label],
            })
