name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality, tests, and package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint TypeScript and JavaScript
        run: pnpm lint:ox

      - name: Lint Vue SFCs
        run: pnpm lint:vue

      - name: Typecheck workspaces
        run: pnpm typecheck

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Install Chromium
        run: pnpm --filter @bubblesjs/antdv-next-pro exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:browser

      - name: Build all workspaces
        run: pnpm build

      - name: Verify package exports
        run: pnpm --filter @bubblesjs/antdv-next-pro verify:package
