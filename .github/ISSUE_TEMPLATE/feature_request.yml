name: 功能建议 / Feature request
description: 提出新的组件能力或现有功能的改进建议。
title: '[Feature]: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        欢迎使用中文或英文提出建议。请先描述需要解决的问题，再说明期望的方案。
        较大的 API 或行为变更，建议先通过 Issue 讨论后再实现。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Problem
      description: 当前遇到了什么限制？为什么现有组件、属性或插槽无法满足需求？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
      description: 描述建议的行为、API 或使用示例，以及它如何解决上述问题。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 是否尝试过组合现有能力、使用插槽或其他方式？说明这些方案的不足。
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 可以提供设计稿、参考实现、相关 Issue，或说明是否愿意提交 PR。
  - type: checkboxes
    id: validations
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 我已阅读[文档](https://bubblesplant.github.io/antv-next-pro/)和[贡献指南](https://github.com/bubblesplant/antv-next-pro/blob/main/CONTRIBUTING.md)。
          required: true
        - label: 我已搜索[现有 Issue](https://github.com/bubblesplant/antv-next-pro/issues)，没有发现重复建议。
          required: true
